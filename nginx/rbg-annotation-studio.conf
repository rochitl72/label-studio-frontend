# RBG Annotation Studio — nginx server block.
#
# Drop this in /etc/nginx/conf.d/ (or sites-available + a symlink to
# sites-enabled), set the values marked CHANGE ME below, and reload nginx.
# It serves the frontend's build/ output and forwards the API to the backend.
#
# ONE ORIGIN. The page and the API are served from the same host and port, so
# the browser's requests to /api/... are same-origin and no CORS
# configuration exists or is needed anywhere in this stack. If you split them
# across two hostnames/ports, the frontend will load but every API call will
# fail — the backend sends no Access-Control-Allow-Origin header by default.
# Keep them together unless you deliberately configure CORS_ORIGINS in
# backend/config.py to match.

upstream rbg_backend {
    # CHANGE ME if the backend (pm2's rbg-backend process) listens on a
    # different host or port. Nothing else in this file refers to it.
    server 127.0.0.1:8000;
}

# Honour the scheme recorded by anything already in front of this (a load
# balancer, a TLS-terminating proxy). Overwriting it with our own $scheme
# would make the backend see plain HTTP for a page loaded over HTTPS, and
# every absolute URL it builds (e.g. the Secure cookie flag) comes back
# wrong. Empty means nothing is in front, and $scheme is then correct.
map $http_x_forwarded_proto $fwd_proto {
    default $http_x_forwarded_proto;
    ""      $scheme;
}

server {
    listen 80;
    server_name _;    # CHANGE ME to the real hostname once known.

    # CHANGE ME to wherever `npm run build` output was deployed — must match
    # the TARGET in .github/workflows/deploy.yml exactly, or the deploy will
    # succeed while nginx serves stale/missing files.
    root /var/www/rbg-annotation-studio;
    index index.html;

    # Multi-image uploads can legitimately be large. 90m matches the
    # backend's own MAX_UPLOAD_MB (see backend/config.py) — keep the two in
    # sync, since whichever is smaller is the real limit a user hits.
    client_max_body_size 90m;

    gzip on;
    gzip_proxied any;
    gzip_comp_level 5;
    gzip_min_length 1024;
    gzip_types application/json text/csv text/plain text/css application/javascript image/svg+xml;

    # config.js is the one file meant to be edited on the server after
    # deployment (see frontend/public/config.js) — it must never be cached,
    # or an edit here takes effect only for new visitors.
    location = /config.js {
        access_log off;
        add_header Cache-Control "no-store";
    }

    # REST API -> backend.
    location /api/ {
        proxy_pass http://rbg_backend;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $fwd_proto;
    }

    # Backend health probe (used by monitoring / the frontend's API status
    # banner).
    location = /health {
        proxy_pass http://rbg_backend;
    }

    # Client-side routing: any unknown path falls back to index.html so deep
    # links and browser refreshes work.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
